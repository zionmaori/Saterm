<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep-space background -->
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>

    <!-- Saturn body: warm gas-giant palette -->
    <radialGradient id="planet" cx="38%" cy="34%" r="70%">
      <stop offset="0%"  stop-color="#ffe7b3"/>
      <stop offset="35%" stop-color="#f6c26b"/>
      <stop offset="70%" stop-color="#c9843a"/>
      <stop offset="100%" stop-color="#5b3714"/>
    </radialGradient>

    <!-- Subtle atmospheric bands overlay -->
    <linearGradient id="bands" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="22%" stop-color="#000000" stop-opacity="0.10"/>
      <stop offset="38%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="52%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="58%" stop-color="#000000" stop-opacity="0.12"/>
      <stop offset="74%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="82%" stop-color="#000000" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Glossy highlight on the planet -->
    <radialGradient id="planetShine" cx="30%" cy="26%" r="30%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring gradient (front/back share the same look) -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#e6d4a8" stop-opacity="0.20"/>
      <stop offset="15%" stop-color="#f2dfae" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fff2c7" stop-opacity="1.00"/>
      <stop offset="85%" stop-color="#e0c98a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#8a6b2e" stop-opacity="0.20"/>
    </linearGradient>

    <!-- Soft glow around the planet -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#ffd68a" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffd68a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffd68a" stop-opacity="0"/>
    </radialGradient>

    <!-- Star sparkle mask filter -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>

    <!-- Clip so the front half of the ring hides only what's in front of the planet -->
    <clipPath id="planetClip">
      <circle cx="512" cy="500" r="220"/>
    </clipPath>
    <clipPath id="ringLower">
      <!-- Everything below the planet's equator: this is where the FRONT of the ring lives -->
      <rect x="0" y="500" width="1024" height="524"/>
    </clipPath>
    <clipPath id="ringUpper">
      <!-- Everything above the equator: BACK of the ring, drawn behind the planet -->
      <rect x="0" y="0" width="1024" height="500"/>
    </clipPath>
  </defs>

  <!-- Background: dark squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Scattered stars -->
  <g fill="#e6edf3">
    <circle cx="120" cy="160" r="2.5" opacity="0.7"/>
    <circle cx="220" cy="110" r="1.8" opacity="0.55"/>
    <circle cx="340" cy="180" r="2.2" opacity="0.65"/>
    <circle cx="700" cy="130" r="1.8" opacity="0.55"/>
    <circle cx="860" cy="180" r="2.5" opacity="0.7"/>
    <circle cx="910" cy="300" r="1.8" opacity="0.5"/>
    <circle cx="160" cy="320" r="1.8" opacity="0.55"/>
    <circle cx="940" cy="470" r="1.8" opacity="0.55"/>
    <circle cx="90"  cy="500" r="2.2" opacity="0.6"/>
    <circle cx="140" cy="720" r="1.8" opacity="0.5"/>
    <circle cx="880" cy="700" r="2.0" opacity="0.6"/>
    <circle cx="80"  cy="380" r="1.6" opacity="0.5"/>
  </g>

  <!-- Sparkle stars with faint glow -->
  <g filter="url(#starGlow)" fill="#ffffff" opacity="0.9">
    <circle cx="820" cy="240" r="2.8"/>
    <circle cx="250" cy="260" r="2.4"/>
    <circle cx="180" cy="620" r="2.4"/>
    <circle cx="820" cy="580" r="2.6"/>
  </g>

  <!-- Soft halo behind Saturn -->
  <circle cx="512" cy="500" r="360" fill="url(#halo)"/>

  <!--
    Ring construction: an ellipse centered on the planet, tilted.
    We draw it in three layers so it correctly weaves around the planet:
      1) BACK half of the ring (above equator) — behind the planet
      2) The planet itself
      3) FRONT half of the ring (below equator) — in front of the planet
  -->
  <g transform="translate(512 500) rotate(-18)">
    <!-- Back half of the ring (behind planet) -->
    <g clip-path="url(#ringUpper)" transform="translate(-512 -500)">
      <g transform="translate(512 500) rotate(-18)">
        <!-- Outer ring band -->
        <ellipse cx="0" cy="0" rx="360" ry="70" fill="none" stroke="url(#ring)" stroke-width="18"/>
        <!-- Cassini division (gap) -->
        <ellipse cx="0" cy="0" rx="330" ry="60" fill="none" stroke="#06080d" stroke-width="6" opacity="0.75"/>
        <!-- Inner ring band -->
        <ellipse cx="0" cy="0" rx="300" ry="50" fill="none" stroke="url(#ring)" stroke-width="12" opacity="0.9"/>
      </g>
    </g>
  </g>

  <!-- The planet -->
  <g>
    <circle cx="512" cy="500" r="220" fill="url(#planet)"/>
    <!-- Atmospheric bands, clipped to planet -->
    <g clip-path="url(#planetClip)">
      <rect x="292" y="280" width="440" height="440" fill="url(#bands)"/>
    </g>
    <!-- Terminator shading on the far side -->
    <circle cx="512" cy="500" r="220" fill="#000" opacity="0.18"
            style="mix-blend-mode:multiply"/>
    <!-- Glossy highlight -->
    <ellipse cx="440" cy="410" rx="90" ry="52" fill="url(#planetShine)"/>
  </g>

  <!-- Front half of the ring (in front of planet) -->
  <g clip-path="url(#ringLower)">
    <g transform="translate(512 500) rotate(-18)">
      <ellipse cx="0" cy="0" rx="360" ry="70" fill="none" stroke="url(#ring)" stroke-width="18"/>
      <ellipse cx="0" cy="0" rx="330" ry="60" fill="none" stroke="#06080d" stroke-width="6" opacity="0.75"/>
      <ellipse cx="0" cy="0" rx="300" ry="50" fill="none" stroke="url(#ring)" stroke-width="12" opacity="0.9"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="512" y="890" font-size="170" font-weight="800" letter-spacing="8" fill="#e6edf3">Saterm</text>
  </g>
</svg>
