<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#06080d"/>
    </radialGradient>
    <radialGradient id="dome" cx="42%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#9ad8ff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#58a6ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1e4d80" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="hull" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b9c4d0"/>
      <stop offset="45%" stop-color="#5a6573"/>
      <stop offset="100%" stop-color="#2a3340"/>
    </linearGradient>
    <linearGradient id="hullRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e6edf3" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#e6edf3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#56d364" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#3fb950" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lightOn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe28a"/>
      <stop offset="60%" stop-color="#d29922"/>
      <stop offset="100%" stop-color="#d29922" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="domeShine" cx="35%" cy="30%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background: dark squircle, matches the app's window background -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>

  <!-- Tiny stars -->
  <g fill="#e6edf3" opacity="0.55">
    <circle cx="140" cy="170" r="3"/>
    <circle cx="260" cy="110" r="2"/>
    <circle cx="380" cy="180" r="2.5"/>
    <circle cx="710" cy="120" r="2"/>
    <circle cx="860" cy="180" r="3"/>
    <circle cx="900" cy="290" r="2"/>
    <circle cx="180" cy="320" r="2"/>
    <circle cx="940" cy="450" r="2"/>
    <circle cx="100" cy="500" r="2.5"/>
  </g>

  <!-- Tractor beam, sitting beneath the saucer -->
  <path d="M 360 540 L 664 540 L 760 880 L 264 880 Z" fill="url(#beam)" opacity="0.85" filter="url(#glow)"/>

  <!-- Saucer hull (ellipse, slightly squashed) -->
  <ellipse cx="512" cy="540" rx="312" ry="78" fill="url(#hull)"/>

  <!-- Top highlight strip on the hull -->
  <ellipse cx="512" cy="520" rx="304" ry="52" fill="url(#hullRim)"/>

  <!-- Dome -->
  <path d="M 322 510
           a 190 170 0 0 1 380 0 Z" fill="url(#dome)"/>
  <!-- Dome glossy reflection -->
  <ellipse cx="442" cy="430" rx="84" ry="42" fill="url(#domeShine)"/>

  <!-- Hull underside shadow -->
  <ellipse cx="512" cy="572" rx="288" ry="38" fill="#000" opacity="0.35"/>

  <!-- Running lights along the rim -->
  <g>
    <circle cx="280" cy="550" r="13" fill="url(#lightOn)"/>
    <circle cx="350" cy="566" r="13" fill="url(#lightOn)"/>
    <circle cx="420" cy="574" r="13" fill="url(#lightOn)"/>
    <circle cx="512" cy="578" r="13" fill="url(#lightOn)"/>
    <circle cx="604" cy="574" r="13" fill="url(#lightOn)"/>
    <circle cx="674" cy="566" r="13" fill="url(#lightOn)"/>
    <circle cx="744" cy="550" r="13" fill="url(#lightOn)"/>
  </g>

  <!-- Antenna with blip on top of the dome -->
  <line x1="512" y1="356" x2="512" y2="296" stroke="#e6edf3" stroke-width="6" stroke-linecap="round"/>
  <circle cx="512" cy="290" r="14" fill="#ff7b72"/>
  <circle cx="512" cy="290" r="24" fill="#ff7b72" opacity="0.25"/>

  <!-- Wordmark -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <text x="512" y="838" font-size="170" font-weight="800" letter-spacing="6" fill="#e6edf3">termion</text>
  </g>
</svg>
