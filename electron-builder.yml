appId: com.saterm.app
productName: Saterm
copyright: Copyright (c) 2026 Zion Maor. All rights reserved.
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - LICENSE
  - NOTICE.md
asarUnpack:
  - resources/**
fileAssociations:
  - ext: html
    name: HTML Document
    description: HTML Document
    role: Viewer
  - ext: htm
    name: HTML Document
    description: HTML Document
    role: Viewer
  - ext: md
    name: Markdown Document
    description: Markdown Document
    role: Editor
  - ext: txt
    name: Plain Text
    description: Plain Text
    role: Editor
  - ext: json
    name: JSON Document
    description: JSON Document
    role: Editor
  - ext: log
    name: Log File
    description: Log File
    role: Viewer
  - ext: yaml
    name: YAML Document
    description: YAML Document
    role: Editor
  - ext: yml
    name: YAML Document
    description: YAML Document
    role: Editor
  - ext: ts
    name: TypeScript Source
    description: TypeScript Source
    role: Editor
  - ext: tsx
    name: TypeScript React Source
    description: TypeScript React Source
    role: Editor
  - ext: js
    name: JavaScript Source
    description: JavaScript Source
    role: Editor
  - ext: jsx
    name: JavaScript React Source
    description: JavaScript React Source
    role: Editor
  - ext: py
    name: Python Source
    description: Python Source
    role: Editor
  - ext: sh
    name: Shell Script
    description: Shell Script
    role: Editor
  - ext: sql
    name: SQL File
    description: SQL File
    role: Editor
  - ext: dump
    name: Database Dump
    description: Database Dump
    role: Editor
win:
  executableName: saterm
  icon: build/icon.ico
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: resources/icon.png
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
deb:
  artifactName: ${name}-${version}.${ext}
rpm:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
