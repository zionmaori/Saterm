name: Release

on:
  push:
    tags:
      - 'v*'   # v1.0.3, v2.0.0-beta.1, etc.

# Allow the job to create releases.
permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Derive version from tag
        id: ver
        run: |
          # GITHUB_REF_NAME is "v1.0.3" — strip the v.
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Sync package.json version to tag
        run: |
          npm version "${{ steps.ver.outputs.version }}" \
            --no-git-tag-version --allow-same-version --silent

      - name: Install dependencies
        # `npm ci` skips the postinstall on some runners; we run install-app-deps
        # explicitly to rebuild native modules (better-sqlite3, node-pty, keytar)
        # against Electron's ABI for this runner's arch.
        run: |
          npm ci
          npx electron-builder install-app-deps

      - name: Build .dmg
        # build:mac normally runs prebuild:mac which patch-bumps; the tag IS
        # the version here, so call electron-vite + electron-builder directly.
        run: |
          npx electron-vite build
          npx electron-builder --mac --publish=never

      - name: Compute artifact paths
        id: artifacts
        run: |
          DMG=$(ls dist/termion-*.dmg | head -1)
          BLOCKMAP="$DMG.blockmap"
          echo "dmg=$DMG"        >> "$GITHUB_OUTPUT"
          echo "blockmap=$BLOCKMAP" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Create or update draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Termion ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.artifacts.outputs.dmg }}
            ${{ steps.artifacts.outputs.blockmap }}
